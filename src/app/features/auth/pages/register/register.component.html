<div class="container">

  <h2>Regisztráció</h2>

  <form (ngSubmit)="submit()">

    <div class="form-control">
      <label>Felhasználónév</label>
      <input
        type="text"
        [(ngModel)]="model.username"
        name="username"
        required />
    </div>

    <div class="form-control">
      <label>Email</label>
      <input
        type="email"
        [(ngModel)]="model.email"
        name="email"
        required />
    </div>

    <div class="form-control">
      <label>Jelszó</label>
      <input
        type="password"
        [(ngModel)]="model.password"
        name="password"
        required />
    </div>

    <button type="submit">Regisztráció</button>
  </form>

  <p *ngIf="error" class="error">{{ error }}</p>

  <p class="link">
    Már van fiókod?
    <a routerLink="/login">Belépés</a>
  </p>

</div>
