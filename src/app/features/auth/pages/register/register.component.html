<div class="auth-page">
  <div class="auth-card">
    
    <div class="card-header">
      <h1 class="title">Csatlakozz Hozzánk!</h1>
      <p class="subtitle">Hozz létre egy új fiókot</p>
    </div>

    <div *ngIf="isLoading" class="loading-state">
      <div class="loader"></div>
    </div>

    <form *ngIf="!isLoading" (ngSubmit)="submit()" class="auth-form">
      
      <div class="form-group">
        <label for="username">Felhasználónév</label>
        <input 
          type="text" 
          id="username"
          [(ngModel)]="model.username" 
          name="username" 
          class="input-field" 
          placeholder="GamerTag123"
          required />
      </div>

      <div class="form-group">
        <label for="email">Email Cím</label>
        <input 
          type="email" 
          id="email"
          [(ngModel)]="model.email" 
          name="email" 
          class="input-field" 
          placeholder="pelda@email.com"
          required />
      </div>

      <div class="form-group">
        <label for="password">Jelszó</label>
        <input 
          type="password" 
          id="password"
          [(ngModel)]="model.password" 
          name="password" 
          class="input-field" 
          placeholder="••••••••"
          required />
      </div>

      <div *ngIf="error" class="error-msg fade-in">
        {{ error }}
      </div>

      <button type="submit" class="btn-submit">
        Regisztráció
      </button>

    </form>

    <div class="card-footer">
      <p>Már van fiókod? <a routerLink="/login" class="link">Jelentkezz be!</a></p>
    </div>

  </div>
</div>
