<div class="page-container">
  <main class="content-wrapper">
    
    <header class="page-header">
      <h1 class="title">Kedvenc Filmjeim</h1>
      <div class="decoration-line"></div>
    </header>

    <ng-container *ngIf="isLoading || error; else favoritesContent">
      <div *ngIf="error; else loading" class="message-box error">
        <strong>Hiba történt:</strong> <span> {{ error }}</span>
      </div>
      <ng-template #loading>
        <div class="message-box loading">
          <div class="loader"></div>
          <p>Kedvencek betöltése...</p>
        </div>
      </ng-template>
    </ng-container>

    <ng-template #favoritesContent>
      
      <div *ngIf="movies.length > 0; else noFavorites" class="media-grid">
        <div *ngFor="let movie of movies" class="media-card">
          
          <div class="poster-wrapper">
            <img [src]="movie.posterUrl" 
                 [alt]="movie.title" 
                 class="poster-image"
                 onerror="this.src='https://placehold.co/400x600/0f1623/ffffff?text=No+Cover'">
            <div class="poster-overlay"></div>
          </div>

          <div class="card-body">
            <div class="card-header">
              <h2 class="media-title" [title]="movie.title">{{ movie.title }}</h2>
              <span class="media-year">{{ movie.releaseYear }}</span>
            </div>

            <h3 class="media-director">Rendezte: {{ movie.director || 'Ismeretlen' }}</h3>

            <div class="tags-container">
              <span *ngFor="let genre of movie.genres" class="tag">{{ genre }}</span>
            </div>

            <div class="spacer"></div>

            <div class="actions-panel">
              <button (click)="removeFromFavorites(movie.id)" class="btn btn-remove">
                <span class="icon">🗑</span> Eltávolítás
              </button>
            </div>
          </div>
        </div>
      </div>

      <ng-template #noFavorites>
        <div class="empty-state">
          <div class="empty-icon">💔</div>
          <p>Jelenleg nincs egyetlen kedvenc filmed sem.</p>
          <p class="sub-text">Jelölj meg párat a főoldalon!</p>
        </div>
      </ng-template>

    </ng-template>
  </main>
</div>
