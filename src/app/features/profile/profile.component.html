<div class="bg-gray-900 min-h-screen text-white flex justify-center">
  <div class="w-full max-w-xl p-4 md:p-8">

    <h1 class="text-3xl font-bold mb-6">Profilom</h1>

    <div *ngIf="isLoading" class="text-center text-gray-400 py-10">
      Profil betöltése...
    </div>

    <div *ngIf="!isLoading && error"
         class="bg-red-900 border border-red-700 text-red-100 px-4 py-3 rounded-lg mb-4">
      {{ error }}
    </div>

    <form *ngIf="!isLoading && profile" (ngSubmit)="onSave()" class="space-y-4">

      <div>
        <label class="block text-sm mb-1">Felhasználónév</label>
        <input
          type="text"
          [(ngModel)]="profile.username"
          name="username"
          class="w-full px-3 py-2 rounded bg-gray-800 border border-gray-700 text-sm" />
      </div>

      <div>
        <label class="block text-sm mb-1">Email</label>
        <input
          type="email"
          [(ngModel)]="profile.email"
          name="email"
          class="w-full px-3 py-2 rounded bg-gray-800 border border-gray-700 text-sm" />
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm mb-1">Szerepkör</label>
          <input
            type="text"
            [ngModel]="profile.role"
            name="role"
            disabled
            class="w-full px-3 py-2 rounded bg-gray-800 border border-gray-700 text-sm opacity-70" />
        </div>

        <div>
          <label class="block text-sm mb-1">Regisztráció dátuma</label>
          <input
            type="text"
            [ngModel]="(profile.createdAt | date:'yyyy.MM.dd HH:mm')"
            name="createdAt"
            disabled
            class="w-full px-3 py-2 rounded bg-gray-800 border border-gray-700 text-sm opacity-70" />
        </div>
      </div>

      <button
        type="submit"
        class="mt-2 px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 text-sm font-medium">
        Profil mentése
      </button>

      <div *ngIf="success" class="mt-2 text-sm text-green-400">
        {{ success }}
      </div>

    </form>
  </div>
</div>
