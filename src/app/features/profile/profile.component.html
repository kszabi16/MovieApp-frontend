<div class="profile-page">
  <div class="profile-card">
    
    <div class="card-header">
      <div class="avatar-placeholder">
        <span>{{ profile?.username?.charAt(0) || 'U' }}</span>
      </div>
      <h1 class="title">Profilom</h1>
      <p class="subtitle">Adataid kezelése</p>
    </div>

    <div *ngIf="isLoading" class="loading-state">
      <div class="loader"></div>
    </div>

    <div *ngIf="!isLoading && error" class="error-msg">
      {{ error }}
    </div>

    <div *ngIf="success" class="success-msg">
      {{ success }}
    </div>

    <form *ngIf="!isLoading && profile" (ngSubmit)="onSave()" class="profile-form">
      
      <div class="form-group">
        <label>Felhasználónév</label>
        <input type="text" [(ngModel)]="profile.username" name="username" class="input-field" />
      </div>

      <div class="form-group">
        <label>Email Cím</label>
        <input type="email" [(ngModel)]="profile.email" name="email" class="input-field" />
      </div>

      <div class="row">
        <div class="form-group">
          <label>Szerepkör</label>
          <input type="text" [ngModel]="profile.role" name="role" disabled class="input-field disabled" />
        </div>

        <div class="form-group">
          <label>Regisztráció</label>
          <input type="text" [ngModel]="(profile.createdAt | date:'yyyy.MM.dd')" name="createdAt" disabled class="input-field disabled" />
        </div>
      </div>

      <button type="submit" class="btn-save">
        Változtatások Mentése
      </button>

    </form>
  </div>
</div>
