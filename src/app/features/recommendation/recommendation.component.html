<div class="page-container">
  <main class="content-wrapper">
    
    <header class="page-header">
      <h1 class="title">Neked Ajánljuk</h1>
      <div class="decoration-line"></div>
      <p class="subtitle">Az AI szerint ezek tetszeni fognak neked</p>
    </header>

    <ng-container *ngIf="isLoading || error; else recContent">
      <div *ngIf="error; else loading" class="message-box error">
        <strong>Hiba történt:</strong> <span> {{ error }}</span>
      </div>
      <ng-template #loading>
        <div class="message-box loading">
          <div class="loader"></div>
          <p>AI elemzés futtatása...</p>
        </div>
      </ng-template>
    </ng-container>

    <ng-template #recContent>
      
      <div *ngIf="movies.length > 0; else noRecs" class="media-grid">
        
        <div *ngFor="let movie of movies" class="media-card">
          <div class="poster-wrapper">
            <img [src]="movie.posterUrl" [alt]="movie.title" class="poster-image" onerror="this.src='https://placehold.co/400x600/0f1623/ffffff?text=No+Cover'">
            <div class="poster-overlay"></div>
          </div>

          <div class="card-body">
            <h2 class="media-title" [title]="movie.title">{{ movie.title }}</h2>
            <p class="media-desc">{{ movie.description }}</p>
            <div class="spacer"></div>
          </div>
        </div>
      </div>

      <ng-template #noRecs>
        <div class="empty-state">
          <div class="empty-icon">🤖</div>
          <p>Még tanuljuk az ízlésedet.</p>
          <p class="sub-text">Értékelj több filmet, hogy pontosabb ajánlásokat kaphass!</p>
        </div>
      </ng-template>

    </ng-template>
  </main>
</div>
