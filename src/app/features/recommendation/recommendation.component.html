<div class="bg-gray-900 min-h-screen text-white flex flex-col">

  <main class="flex-1 p-4 md:p-8">
    <h1 class="text-3xl font-bold mb-6">Ajánlott filmek</h1>

    <ng-container *ngIf="isLoading || error; else moviesContent">
      <div *ngIf="error; else loading"
           class="bg-red-900 border border-red-700 text-red-100 px-4 py-3 rounded-lg" role="alert">
        <strong class="font-bold">Hiba történt:</strong>
        <span class="block sm:inline"> {{ error }}</span>
      </div>

      <ng-template #loading>
        <div class="text-center py-20">
          <p class="text-xl text-gray-400">Ajánlások betöltése...</p>
        </div>
      </ng-template>
    </ng-container>

    <ng-template #moviesContent>

      <div *ngIf="movies.length > 0; else noMovies"
           class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">

        <div *ngFor="let movie of movies"
             class="bg-gray-800 rounded-lg shadow-lg overflow-hidden flex flex-col">

          <img [src]="movie.posterUrl"
               [alt]="movie.title"
               class="w-full h-64 object-cover"
               onerror="this.src='https://placehold.co/400x600/374151/9ca3af?text=No+Poster'">

          <div class="p-4 flex flex-col flex-grow">
            <h2 class="text-xl font-semibold truncate" [title]="movie.title">
              {{ movie.title }} ({{ movie.releaseYear }})
            </h2>

            <h3 class="text-sm text-gray-400 mb-1">
              Rendező: {{ movie.director || 'Ismeretlen' }}
            </h3>

            <p class="text-gray-400 text-sm mt-1 h-20 overflow-y-auto">
              {{ movie.description }}
            </p>

            <div class="mt-3 flex flex-wrap gap-2">
              <span *ngFor="let genre of movie.genres"
                    class="bg-blue-600 text-blue-100 text-xs px-2 py-0.5 rounded-full">
                {{ genre }}
              </span>
            </div>

            <div class="flex-grow"></div>

            <div class="mt-4 pt-4 border-t border-gray-700 flex flex-col gap-2">

              <div class="flex justify-between items-center">
                <span class="text-sm text-gray-400">Értékelésem:</span>
                <div class="flex gap-1">
                  <button *ngFor="let star of [1,2,3,4,5]"
                          (click)="onRate(movie.id, star)"
                          class="text-lg hover:text-yellow-400 transition-colors"
                          [class.text-yellow-400]="getRating(movie.id) >= star"
                          [class.text-gray-500]="getRating(movie.id) < star"
                          [title]="star + ' csillag'">
                    &#9733;
                  </button>
                </div>
              </div>

              <button (click)="onToggleFavorite(movie.id)"
                      class="w-full text-white text-sm font-medium py-2 px-3 rounded-lg transition-colors"
                      [class.bg-pink-600]="!isFavorite(movie.id)"
                      [class.hover:bg-pink-700]="!isFavorite(movie.id)"
                      [class.bg-gray-500]="isFavorite(movie.id)"
                      [class.hover:bg-gray-600]="isFavorite(movie.id)">
                {{ isFavorite(movie.id) ? 'Kedvenc (Töröl)' : 'Kedvenc' }}
              </button>

              <button (click)="onToggleSeen(movie.id)"
                      class="w-full text-white text-sm font-medium py-2 px-3 rounded-lg transition-colors"
                      [class.bg-gray-700]="!isSeen(movie.id)"
                      [class.hover:bg-gray-600]="!isSeen(movie.id)"
                      [class.bg-green-600]="isSeen(movie.id)"
                      [class.hover:bg-green-700]="isSeen(movie.id)">
                {{ isSeen(movie.id) ? 'Láttam (Töröl)' : 'Láttam' }}
              </button>
            </div>
          </div>
        </div>
      </div>

      <ng-template #noMovies>
        <div class="text-center py-20">
          <p class="text-xl text-gray-500">
            Jelenleg nincs elég adat, hogy ajánljunk neked filmeket. Nézz meg és értékelj néhányat!
          </p>
        </div>
      </ng-template>

    </ng-template>
  </main>
</div>
