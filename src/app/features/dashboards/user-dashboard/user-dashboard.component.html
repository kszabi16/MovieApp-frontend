<div class="dashboard-page">
  <main class="content-wrapper">

    <header class="page-header">
      <h1 class="title">Filmek</h1>
      <div class="decoration-line"></div>
    </header>

    <div class="search-section">
      <div class="search-bar">

        <button type="button" class="filter-toggle-btn" (click)="toggleSearchDropdown()">
          <span class="filter-label">{{ getSearchFieldLabel() }}</span>
          <span class="filter-arrow">▼</span>
        </button>

        <input
          type="text"
          class="search-input"
          [ngModel]="searchTerm"
          (ngModelChange)="onSearchTermChange($event)"
          placeholder="Keresés..." />

        <button type="button" class="search-icon-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>

        <div *ngIf="isSearchDropdownOpen" class="dropdown-menu fade-in">
          <button type="button" class="dropdown-item" (click)="setSearchField('all')">Minden</button>
          <button type="button" class="dropdown-item" (click)="setSearchField('title')">Cím</button>
          <button type="button" class="dropdown-item" (click)="setSearchField('director')">Rendező</button>
          <button type="button" class="dropdown-item" (click)="setSearchField('genre')">Műfaj</button>
        </div>

        <div *ngIf="searchField === 'genre' && genreSuggestions.length > 0 && searchTerm" class="suggestions-menu fade-in">
          <button *ngFor="let g of genreSuggestions" type="button" class="suggestion-item" (click)="selectGenre(g)">
            {{ g }}
          </button>
        </div>

      </div>
    </div>

    <ng-container *ngIf="isLoading || error; else moviesContent">
      <div *ngIf="error; else loading" class="message-box error">
        <strong>Hiba történt:</strong>
        <span> {{ error }}</span>
      </div>

      <ng-template #loading>
        <div class="message-box loading">
          <div class="loader"></div>
          <p>Rendszer betöltése...</p>
        </div>
      </ng-template>
    </ng-container>

    <ng-template #moviesContent>

      <div *ngIf="filteredMovies.length > 0; else noMovies" class="media-grid">
        
        <div *ngFor="let movie of filteredMovies" class="media-card">
          
          <div class="poster-wrapper">
            <img [src]="movie.posterUrl" 
                 [alt]="movie.title" 
                 class="poster-image"
                 onerror="this.src='https://placehold.co/400x600/0f1623/ffffff?text=No+Cover'">
            <div class="poster-overlay"></div>
          </div>

          <div class="card-body">
            <div class="card-header">
              <h2 class="media-title" [title]="movie.title">{{ movie.title }}</h2>
              <span class="media-year">{{ movie.releaseYear }}</span>
            </div>

            <h3 class="media-director">Rendezte: {{ movie.director || 'Ismeretlen' }}</h3>

            <p class="media-desc">
              {{ movie.description }}
            </p>

            <div class="tags-container">
              <span *ngFor="let genre of movie.genres" class="tag">
                {{ genre }}
              </span>
            </div>

            <div class="spacer"></div>

            <div class="actions-panel">
              
              <div class="rating-wrapper">
                <span class="label">Rating:</span>
                <div class="stars">
                  <button *ngFor="let star of [1,2,3,4,5]" 
                          (click)="onRate(movie.id, star)" 
                          class="star-btn"
                          [class.active]="getRating(movie.id) >= star"
                          title="{{star}} csillag">
                    ★
                  </button>
                </div>
              </div>

              <div class="buttons-row">
                <button (click)="onToggleFavorite(movie.id)" 
                        class="btn btn-favorite"
                        [class.active]="isFavorite(movie.id)">
                  {{ isFavorite(movie.id) ? '♥ Kedvenc' : '♡ Hozzáadás' }}
                </button>
                
                <button (click)="onToggleSeen(movie.id)" 
                        class="btn btn-seen"
                        [class.active]="isSeen(movie.id)">
                  {{ isSeen(movie.id) ? '👁 Láttam' : '○ Megnézem' }}
                </button>
              </div>
            </div>
          </div>
        </div>

      </div>

      <ng-template #noMovies>
        <div class="empty-state">
          <div class="empty-icon">∅</div>
          <p>Nincs találat a keresési feltételek alapján.</p>
        </div>
      </ng-template>

    </ng-template>
  </main>
</div>
