<nav *ngIf="isLoggedIn"
     class="flex items-center justify-between px-4 md:px-8 py-4 bg-gray-900 border-b border-gray-800 text-white">

  <div class="text-xl font-bold">
    FilmApp
  </div>

  <div class="flex items-center gap-3">

    <button
      class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-sm font-medium"
      (click)="goToMovies()">
      Filmek
    </button>

    <button
      class="px-4 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 text-sm font-medium"
      (click)="goToProfile()">
      Profil
    </button>

    <button
      *ngIf="role === 'User'"
      class="px-4 py-2 rounded-lg bg-purple-600 hover:bg-purple-700 text-sm font-medium"
      (click)="goToFavorites()">
      Kedvenceim
    </button>

    <button
      *ngIf="role === 'User'"
      class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-sm font-medium"
      (click)="goToRecommendations()">
      Ajánlottak
    </button>

    <button
      class="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-sm font-medium"
      (click)="logout()">
      Kijelentkezés
    </button>
  </div>
</nav>
