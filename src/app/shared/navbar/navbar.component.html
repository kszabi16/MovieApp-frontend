<nav *ngIf="isLoggedIn" class="navbar">
  <div class="nav-container">

    <div class="nav-brand">
      <span class="brand-text">MOVIE<span class="highlight">APP</span></span>
    </div>

    <div class="nav-links" *ngIf="showUserNav">
      <button class="nav-item" (click)="goToMovies()" routerLinkActive="active">
        <span class="icon">🎬</span> Filmek
      </button>

      <button class="nav-item" (click)="goToRecommendations()" routerLinkActive="active">
        <span class="icon">✨</span> Ajánlottak
      </button>

      <button class="nav-item" (click)="goToLeaderboard()" routerLinkActive="active">
        <span class="icon">🏆</span> Ranglista
      </button>

      <button *ngIf="role === 'User'" class="nav-item" (click)="goToFavorites()" routerLinkActive="active">
        <span class="icon">♥</span> Kedvencek
      </button>

      <button *ngIf="role === 'User'" class="nav-item" (click)="goToTopRated()" routerLinkActive="active">
        <span class="icon">⭐</span> Legjobbak
      </button>
    </div>

    <div class="nav-actions">
      <button
        class="nav-item profile-btn"
        *ngIf="showUserNav"
        (click)="goToProfile()"
        routerLinkActive="active">
        <span class="icon">👤</span> Profil
      </button>

      <button class="btn-logout" (click)="logout()">
        Kijelentkezés
      </button>
    </div>

  </div>
</nav>
